<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personalized Learning Platform</title>
<style>
  body{font-family:Segoe UI,Arial,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;background:#f5f7fb;color:#1f2937}
  .card{background:#fff;border-radius:10px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .topic{font-size:12px;color:#6366f1;font-weight:600;text-transform:uppercase}
  .badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;color:#fff}
  .L1{background:#16a34a}.L2{background:#d97706}.L3{background:#dc2626}
  label{display:block;margin:8px 0;cursor:pointer}
  button{background:#4f46e5;color:#fff;border:0;padding:10px 20px;border-radius:8px;font-size:16px;cursor:pointer}
  .bar{height:12px;border-radius:6px;background:#e5e7eb;overflow:hidden;margin-bottom:12px}
  .fill{height:100%}
  .WEAK{color:#dc2626}.DEVELOPING{color:#d97706}.STRONG{color:#16a34a}
  .ok{color:#16a34a;font-weight:600}.bad{color:#dc2626;font-weight:600}
  .progress{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:8px 0}
  .progress div{height:100%;background:#4f46e5}
</style>
</head>
<body>
<h1>Personalized Learning Platform</h1>
<p>An adaptive quiz: questions get harder when you do well and easier when you struggle.</p>
<div id="app"></div>
<script>
const NAMES = {1: 'Easy', 2: 'Medium', 3: 'Hard'};
let answers = [];
let levels = [];
let current = null;

function start() {
  answers = [];
  levels = [];
  current = null;
  next();
}

async function next() {
  const res = await fetch('/api/quiz/next', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ answers })
  });
  const d = await res.json();
  if (d.finished) { finish(); return; }
  current = d.question;
  levels.push(d.level);
  show(d);
}

function show(d) {
  let feedback = '';
  if (d.lastCorrect === true) feedback = '<p class="ok">Correct! Next question is harder.</p>';
  if (d.lastCorrect === false) feedback = '<p class="bad">Not quite. Next question is easier.</p>';
  const opts = ['a', 'b', 'c', 'd'].map(k =>
    '<label><input type="radio" name="opt" value="' + k.toUpperCase() + '"> ' + current[k] + '</label>').join('');
  const pct = Math.round(100 * (d.number - 1) / d.total);
  document.getElementById('app').innerHTML =
    feedback +
    '<div class="card">' +
      '<div class="progress"><div style="width:' + pct + '%"></div></div>' +
      '<span class="topic">' + current.topic + '</span> ' +
      '<span class="badge L' + d.level + '">' + NAMES[d.level] + '</span>' +
      '<p><b>Question ' + d.number + ' of ' + d.total + ':</b> ' + current.text + '</p>' +
      opts +
      '<br><button onclick="choose()">Next</button>' +
    '</div>';
}

function choose() {
  const c = document.querySelector('input[name="opt"]:checked');
  if (!c) { alert('Please pick an answer'); return; }
  answers.push({ questionId: current.id, choice: c.value });
  next();
}

async function finish() {
  const res = await fetch('/api/quiz/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ answers })
  });
  const r = await res.json();

  let html = '<div class="card"><h2>Score: ' + r.score + ' / ' + r.total + '</h2>';
  html += '<p><b>Difficulty journey:</b> ' + levels.map(l => NAMES[l]).join(' &rarr; ') + '</p>';
  r.topics.forEach(t => {
    const color = t.status === 'STRONG' ? '#16a34a' : t.status === 'DEVELOPING' ? '#d97706' : '#dc2626';
    html += '<p><b>' + t.topic + '</b> - <span class="' + t.status + '">' + t.status + '</span> (' + t.correct + '/' + t.total + ')</p>' +
            '<div class="bar"><div class="fill" style="width:' + t.percent + '%;background:' + color + '"></div></div>';
  });
  html += '</div><div class="card"><h2>Your learning path</h2>';
  if (r.learningPath.length === 0) html += '<p>Great job! No weak topics found.</p>';
  r.learningPath.forEach(s => {
    html += '<p><b>Step ' + s.step + ':</b> ' + s.lesson + ' <i>(' + s.topic + ', ' + s.minutes + ' min)</i></p>';
  });
  html += '<button onclick="start()">Retake quiz</button></div>';
  document.getElementById('app').innerHTML = html;
}

start();
</script>
</body>
</html>
